name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Repo publik dibaca saja; tidak ada secret yang dipakai di workflow ini.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Semua nilai di bawah ini dummy: tidak ada secret, tidak ada URL deploy.
      # Backend (backend/.env.test) memakai variabel yang sama, jadi nilainya
      # dideklarasikan sekali di sini.
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/booking_e2e_test
      JWT_SECRET: ci-dummy-jwt-secret-bukan-rahasia
      PORT: "3001"
      RUN_MODE: api
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      REDIS_URL: redis://127.0.0.1:6379/15
      MAIL_PROVIDER: smtp
      MAIL_FROM: no-reply@example.com
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_secret
      PAYMENT_CURRENCY: idr
      ACCESS_TOKEN_TTL_MINUTES: "15"
      REFRESH_TOKEN_TTL_DAYS: "30"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin12345
      # Frontend (Vite) memakai kedua nilai ini saat dev server berjalan.
      VITE_BASE_URL: http://localhost:5173
      VITE_API_BASE_URL: http://127.0.0.1:3001
      # Output debug e2e ditulis ke direktori sementara di runner.
      E2E_DEBUG_OUTPUT_DIR: /tmp/e2e-debug
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: farhanbudi/booking-backend
          ref: main
          path: backend
          # Repo backend publik, jadi tidak butuh token. Kalau nanti jadi private,
          # tambahkan `token: ${{ secrets.BACKEND_REPO_TOKEN }}` di sini.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Write backend .env.test
        working-directory: backend
        run: |
          cat > .env.test <<EOF
          NODE_ENV=$NODE_ENV
          DATABASE_URL=$DATABASE_URL
          JWT_SECRET=$JWT_SECRET
          PORT=$PORT
          RUN_MODE=$RUN_MODE
          CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
          REDIS_URL=$REDIS_URL
          MAIL_PROVIDER=$MAIL_PROVIDER
          MAIL_FROM=$MAIL_FROM
          SMTP_HOST=$SMTP_HOST
          SMTP_PORT=$SMTP_PORT
          SMTP_USER=
          SMTP_PASS=
          STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
          STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET
          PAYMENT_CURRENCY=$PAYMENT_CURRENCY
          ACCESS_TOKEN_TTL_MINUTES=$ACCESS_TOKEN_TTL_MINUTES
          REFRESH_TOKEN_TTL_DAYS=$REFRESH_TOKEN_TTL_DAYS
          ADMIN_EMAIL=$ADMIN_EMAIL
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          EOF

      - name: Start backend (test server)
        working-directory: backend
        run: |
          nohup bun run test:server > ../backend.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for backend readiness
        run: |
          if ! curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-connrefused --retry-max-time 180 \
            http://127.0.0.1:3001/health; then
            echo "::error::Backend tidak siap dalam batas waktu. Isi backend.log:"
            cat backend.log || true
            exit 1
          fi
          echo "Backend siap di http://127.0.0.1:3001/health"

      - name: Make seeded resources free (no Stripe)
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d booking_e2e_test \
            -c "UPDATE resources SET price_per_hour = 0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        run: npm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            playwright-report
            test-results
            backend.log
          retention-days: 7
