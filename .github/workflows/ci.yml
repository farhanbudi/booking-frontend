name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nilai dummy: build & unit test tidak butuh backend sungguhan.
      # Jangan ganti dengan secret atau URL deploy.
      VITE_BASE_URL: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # Job agregat: satu-satunya status check yang perlu di-require saat branch protection.
  # Nama job ini harus persis "ci-success".
  ci-success:
    name: CI Success
    if: always()
    needs:
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        if: needs.frontend.result != 'success'
        run: |
          echo "::error::Job 'frontend' selesai dengan hasil '${{ needs.frontend.result }}'"
          exit 1

      - name: All checks passed
        run: echo "Semua pemeriksaan CI lulus."
